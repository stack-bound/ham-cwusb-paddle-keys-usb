name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -ldflags "-X main.version=$(cat VERSION)" -o paddlekeys .
      - run: ./paddlekeys -version && ./paddlekeys -list-keys >/dev/null
      - name: Package snapshot (no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke-install the .deb
        run: |
          sudo dpkg -i dist/paddlekeys_*_linux_amd64.deb
          paddlekeys -version
          test -f /usr/lib/systemd/system/paddlekeys.service
          test -f /usr/lib/udev/rules.d/80-paddlekeys.rules
          test -f /etc/default/paddlekeys
          systemd-analyze verify /usr/lib/systemd/system/paddlekeys.service
          sudo dpkg -r paddlekeys
